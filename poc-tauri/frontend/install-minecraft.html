<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Install Minecraft Server - real InstallMinecraftServerPanel.tsx through Tauri</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      .page {
        padding: 24px;
        max-width: 700px;
      }
      h1 {
        font-size: 1.3rem;
      }
      h3 {
        margin: 0 0 8px;
      }
      p {
        color: #c9cdd6;
        font-size: 0.9rem;
      }
      button {
        background: #2c303a;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #3a3f4b;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      input,
      select {
        background: #0f1115;
        color: #e6e8ec;
        border: 1px solid #2c303a;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
        font-size: 0.85rem;
        color: #c9cdd6;
      }
      label.checkbox {
        flex-direction: row;
        align-items: center;
        gap: 6px;
      }
      .cluster-section {
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 16px;
        background: #1a1d24;
      }
      .empty-state {
        color: #9aa0ab;
      }
      .error-message {
        color: #ff8080;
      }
      .status-message {
        color: #3fbf6f;
      }
      .path-input-row {
        display: flex;
        gap: 8px;
      }
      .path-input-row input,
      .path-input-row select {
        flex: 1;
      }
      .form-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }
      .server-type-icon-large {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        object-fit: cover;
      }
      pre {
        background: #0f1115;
        border: 1px solid #2c303a;
        border-radius: 4px;
        padding: 10px;
        font-size: 0.8rem;
        overflow: auto;
      }
      a {
        color: #8ab4ff;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html" style="color: #8ab4ff">&larr; back to the main PoC page</a></p>
    <div class="page">
      <h1>Install Minecraft Server</h1>
      <div id="root"></div>
    </div>
    <script type="module" src="install-minecraft.js"></script>
  </body>
</html>
