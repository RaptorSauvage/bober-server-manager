<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Mods - real ModsTab.tsx through Tauri</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      .page {
        padding: 24px;
        max-width: 1100px;
      }
      h1 {
        font-size: 1.3rem;
      }
      h3 {
        margin: 0 0 8px;
      }
      p {
        color: #c9cdd6;
        font-size: 0.9rem;
      }
      code {
        background: #0f1115;
        padding: 1px 4px;
        border-radius: 3px;
      }
      button {
        background: #2c303a;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #3a3f4b;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.danger {
        border-color: #7a3a3a;
      }
      input {
        background: #0f1115;
        color: #e6e8ec;
        border: 1px solid #2c303a;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      .cluster-section {
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 16px;
        background: #1a1d24;
      }
      .empty-state {
        color: #9aa0ab;
      }
      .error-message {
        color: #ff8080;
      }
      .status-message {
        color: #3fbf6f;
      }
      .muted {
        color: #9aa0ab;
      }
      .path-input-row {
        display: flex;
        gap: 8px;
      }
      .path-input-row input {
        flex: 1;
      }
      .ark-mod-search-results {
        margin-top: 10px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .ark-mod-search-result {
        display: flex;
        align-items: center;
        gap: 10px;
        border: 1px solid #2c303a;
        border-radius: 4px;
        padding: 6px 10px;
      }
      .ark-mod-icon {
        width: 28px;
        height: 28px;
        border-radius: 4px;
        object-fit: cover;
      }
      .ark-mod-search-result-info {
        flex: 1;
        display: flex;
        flex-direction: column;
      }
      .ark-mod-search-result-name {
        font-weight: bold;
      }
      .ark-mod-search-result-summary {
        font-size: 0.8rem;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        max-width: 500px;
      }
      .ark-mod-search-result-downloads {
        font-size: 0.8rem;
      }
      .mods-add {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
      }
      .ark-mods-grid {
        display: grid;
        gap: 0;
        border: 1px solid #2c303a;
        border-radius: 6px;
        overflow: hidden;
      }
      .ark-mods-grid--ascended {
        grid-template-columns: 70px 70px 60px 140px 1fr 160px;
      }
      .ark-mods-grid--evolved {
        grid-template-columns: 70px 140px 1fr 160px;
      }
      .ark-mods-grid-header {
        background: #1a1d24;
        padding: 6px 8px;
        font-size: 0.8rem;
        color: #9aa0ab;
        border-bottom: 1px solid #2c303a;
      }
      .mods-select-col-header {
        display: flex;
        align-items: center;
        gap: 4px;
      }
      .ark-mods-grid-cell {
        padding: 6px 8px;
        border-bottom: 1px solid #2c303a;
        display: flex;
        align-items: center;
        font-size: 0.85rem;
      }
      .ark-mods-grid-cell.mod-disabled {
        opacity: 0.5;
      }
      .mod-id {
        font-family: 'SF Mono', Consolas, monospace;
      }
      .ark-mod-name-cell {
        gap: 8px;
      }
      .mod-name-input {
        width: 100%;
      }
      .ark-mod-title {
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ark-mods-grid-actions {
        gap: 4px;
      }
      .ark-mods-grid-empty {
        grid-column: 1 / -1;
        padding: 16px;
        text-align: center;
        color: #9aa0ab;
      }
      .form-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 10px 0;
      }
      .mods-copy-paste {
        margin-top: 20px;
      }
      .mods-paste-area {
        width: 100%;
        height: 100px;
        background: #0f1115;
        color: #e6e8ec;
        border: 1px solid #2c303a;
        border-radius: 4px;
        padding: 8px;
        font-family: 'SF Mono', Consolas, monospace;
        font-size: 0.85rem;
        box-sizing: border-box;
        resize: vertical;
      }
      a {
        color: #8ab4ff;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html">&larr; back to the main PoC page</a></p>
    <div class="page">
      <h1>Mods</h1>
      <div id="root"></div>
    </div>
    <script type="module" src="mods.js"></script>
  </body>
</html>
