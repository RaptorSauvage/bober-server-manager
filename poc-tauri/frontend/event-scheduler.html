<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Event Scheduler - real EventSchedulerView.tsx through Tauri</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      .page {
        padding: 24px;
        max-width: 1200px;
      }
      .server-detail-header {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 12px;
      }
      h1 {
        font-size: 1.3rem;
        margin: 0;
        flex: 1;
      }
      h2 {
        font-size: 1.1rem;
        margin: 0;
        flex: 1;
      }
      h3 {
        margin: 16px 0 6px;
        font-size: 0.9rem;
        color: #c9cdd6;
      }
      button {
        background: #2c303a;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #3a3f4b;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.btn-accent {
        background: #3a5f8a;
        border-color: #4a7fc0;
      }
      button.danger {
        border-color: #7a3a3a;
      }
      .tab-nav {
        display: flex;
        gap: 4px;
        margin-bottom: 12px;
      }
      .tab-nav button.active {
        background: #3a5f8a;
        border-color: #4a7fc0;
      }
      .map-manager-table {
        width: 100%;
        border-collapse: collapse;
      }
      .map-manager-table th,
      .map-manager-table td {
        text-align: left;
        padding: 6px 8px;
        border-bottom: 1px solid #2c303a;
      }
      .mono {
        font-family: 'SF Mono', Consolas, monospace;
        font-size: 0.85rem;
      }
      .event-badge {
        margin-left: 6px;
        font-size: 0.75rem;
        color: #d9a441;
      }
      .badge {
        font-size: 0.75rem;
        padding: 1px 6px;
        border-radius: 3px;
        background: #2c303a;
      }
      .badge-running {
        background: #1f4d33;
        color: #3fbf6f;
      }
      .badge-scheduled {
        background: #3a3a1f;
        color: #d9a441;
      }
      .badge-disabled {
        background: #2c303a;
        color: #9aa0ab;
      }
      .badge-stopped {
        background: #3a1f1f;
        color: #ff8080;
      }
      label.checkbox {
        display: inline-flex;
        align-items: center;
        gap: 4px;
      }
      .empty-state {
        color: #9aa0ab;
      }
      .error-message {
        color: #ff8080;
      }
      /* Modal/wizard overlay - this PoC's first page needing one. */
      .wizard-overlay {
        position: fixed;
        inset: 0;
        background: rgba(0, 0, 0, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
        z-index: 20;
      }
      .wizard-modal {
        background: #1a1d24;
        border: 1px solid #3a3f4b;
        border-radius: 8px;
        padding: 20px 24px;
        max-height: 85vh;
        overflow-y: auto;
        width: 480px;
      }
      .wizard-modal-wide {
        width: 640px;
      }
      .wizard-header {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 4px;
      }
      .wizard-header-icon {
        font-size: 1.2rem;
      }
      .wizard-close {
        background: transparent;
        border: none;
      }
      .wizard-subtitle {
        color: #9aa0ab;
        font-size: 0.85rem;
        margin: 0 0 12px;
      }
      .wizard-body {
        display: flex;
        flex-direction: column;
        gap: 4px;
      }
      .wizard-field {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
        font-size: 0.85rem;
      }
      .wizard-field input {
        background: #0f1115;
        color: #e6e8ec;
        border: 1px solid #2c303a;
        border-radius: 4px;
        padding: 6px 8px;
        font: inherit;
      }
      .settings-grid {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 12px;
      }
      .event-target-toggle {
        display: flex;
        gap: 6px;
        margin-bottom: 10px;
      }
      .event-target-toggle button.active {
        background: #3a5f8a;
        border-color: #4a7fc0;
      }
      .event-scheduler-server-list {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
      }
      .wizard-footer {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 16px;
        padding-top: 12px;
        border-top: 1px solid #2c303a;
      }
      .wizard-footer > div {
        display: flex;
        gap: 8px;
      }
      .wizard-primary {
        background: #3a5f8a;
        border-color: #4a7fc0;
      }
      a {
        color: #8ab4ff;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html">&larr; back to the main PoC page</a></p>
    <div class="page">
      <div id="root"></div>
    </div>
    <script type="module" src="event-scheduler.js"></script>
  </body>
</html>
