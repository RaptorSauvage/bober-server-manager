<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Minecraft Mods - real ModsTab.tsx through Tauri</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      .page {
        padding: 24px;
        max-width: 1100px;
      }
      h1 {
        font-size: 1.3rem;
      }
      h3 {
        margin: 0 0 8px;
      }
      p {
        color: #c9cdd6;
        font-size: 0.9rem;
      }
      button {
        background: #2c303a;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #3a3f4b;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.danger:hover:not(:disabled) {
        border-color: #e5484d;
        color: #e5484d;
      }
      input {
        background: #0f1115;
        color: #e6e8ec;
        border: 1px solid #2c303a;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      .cluster-section {
        background: #1a1d24;
        border: 1px solid #2c303a;
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .empty-state {
        color: #9aa0ab;
      }
      .error-message {
        color: #ff8080;
      }
      .muted {
        color: #9aa0ab;
        font-weight: 400;
        font-size: 0.8rem;
      }
      .path-input-row {
        display: flex;
        gap: 8px;
      }
      .path-input-row input {
        flex: 1;
      }
      .form-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 0;
      }
      .server-type-icon {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        object-fit: cover;
        flex-shrink: 0;
      }
      .mc-mods-browse-heading {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .mc-mods-grid {
        display: grid;
        width: 100%;
        column-gap: 12px;
      }
      .mc-mods-grid--browse {
        grid-template-columns: minmax(0, 260px) minmax(0, 1fr) 100px 110px auto;
      }
      .mc-mods-grid--installed {
        grid-template-columns: minmax(0, 1fr) 100px 150px 130px auto;
      }
      .mc-mods-grid-header,
      .mc-mods-grid-cell {
        display: flex;
        align-items: center;
        min-width: 0;
        padding: 8px;
        border-bottom: 1px solid #2c303a;
        font-size: 0.85rem;
      }
      .mc-mods-grid-header {
        font-weight: 600;
      }
      .mc-mods-grid-empty {
        grid-column: 1 / -1;
        color: #9aa0ab;
      }
      .mc-mod-name-cell {
        gap: 8px;
      }
      .mc-mod-source-cell {
        gap: 6px;
        flex-wrap: wrap;
      }
      .mc-mod-source-icon {
        width: 22px;
        height: 22px;
        object-fit: contain;
        flex-shrink: 0;
      }
      .mc-mod-description-cell {
        white-space: normal;
        align-items: flex-start;
      }
      .mc-mod-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .mc-mods-grid-actions {
        gap: 8px;
        flex-wrap: nowrap;
      }
      .mc-mod-icon {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        object-fit: cover;
        flex-shrink: 0;
      }
      a {
        color: #8ab4ff;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html" style="color: #8ab4ff">&larr; back to the main PoC page</a></p>
    <div class="page">
      <h1>Minecraft Mods</h1>
      <div id="root"></div>
    </div>
    <script type="module" src="minecraft-mods.js"></script>
  </body>
</html>
