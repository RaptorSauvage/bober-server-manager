<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>App shell - real App.tsx through Tauri</title>
    <link rel="stylesheet" href="app-styles.css" />
    <style>
      /* PoC-only: a way back to this PoC's own demo landing page (index.html). Deliberately
         NOT added inside App.tsx/TitleBar.tsx (real, unmodified source) - sits just below the
         real title bar's 40px row instead, as a plain DOM element outside the React tree. */
      #poc-back-to-index {
        position: fixed;
        top: 44px;
        left: 6px;
        z-index: 9999;
        background: #1d2027;
        border: 1px solid #2c303a;
        color: #9aa0ab;
        border-radius: 6px;
        padding: 3px 8px;
        font: 11px -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        cursor: pointer;
      }
      #poc-back-to-index:hover {
        border-color: #4f8cff;
        color: #e6e8ec;
      }
    </style>
  </head>
  <body>
    <button id="poc-back-to-index" type="button" title="Back to this PoC's demo landing page">&larr; PoC index</button>
    <div id="root"></div>
    <script type="module" src="app.js"></script>
    <script type="module">
      document.getElementById('poc-back-to-index').addEventListener('click', () => {
        window.location.href = 'index.html'
      })
    </script>
  </body>
</html>
