<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>App shell - real App.tsx through Tauri</title>
    <link rel="stylesheet" href="app-styles.css" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="app.js"></script>
    <script type="module">
      // PoC-only: a way back to this PoC's own demo landing page (index.html), reachable from
      // the real Settings screen as a "Debug" button rather than a Tools-menu shortcut (the real
      // app has no index.html to go back to, so this has no real-app equivalent at all).
      // Deliberately NOT done by editing DataSettingsView.tsx (real, unmodified source) -
      // instead, a MutationObserver watches for the real `.settings-view` React mount (it exists
      // in the DOM for as long as the Settings screen is open - see DataSettingsView.tsx's own
      // top-level `<div className="server-detail settings-view">`) and appends one extra button
      // to its `.server-detail-header` (the row holding the "<- Back" button and the "Settings"
      // title), styled by the exact same real app-styles.css rules that header's own real button
      // already uses. Re-injects every time Settings is reopened, since React unmounts (and so
      // removes our appended node with it) every time it closes.
      new MutationObserver((mutations) => {
        for (const mutation of mutations) {
          for (const node of mutation.addedNodes) {
            if (!(node instanceof HTMLElement) || !node.classList.contains('settings-view')) continue
            const header = node.querySelector('.server-detail-header')
            if (!header) continue
            const button = document.createElement('button')
            button.type = 'button'
            button.textContent = 'Debug'
            button.addEventListener('click', () => {
              window.location.href = 'index.html'
            })
            header.appendChild(button)
          }
        }
      }).observe(document.body, { childList: true, subtree: true })
    </script>
  </body>
</html>
