<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Settings - real SettingsTab.tsx through Tauri</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      .page {
        padding: 24px;
        max-width: 1100px;
      }
      h1 {
        font-size: 1.3rem;
      }
      h3 {
        margin: 0 0 8px;
      }
      p {
        color: #c9cdd6;
        font-size: 0.9rem;
      }
      button {
        background: #2c303a;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #3a3f4b;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      button.active {
        border-color: #5a8fd6;
        background: #27344a;
      }
      input,
      select,
      textarea {
        background: #0f1115;
        color: #e6e8ec;
        border: 1px solid #2c303a;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
        font-size: 0.85rem;
        color: #c9cdd6;
      }
      label.checkbox {
        flex-direction: row;
        align-items: center;
        gap: 6px;
      }
      .cluster-section {
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 14px 16px;
        margin-bottom: 16px;
        background: #1a1d24;
      }
      .empty-state {
        color: #9aa0ab;
      }
      .error-message {
        color: #ff8080;
      }
      .status-message {
        color: #3fbf6f;
      }
      .path-input-row {
        display: flex;
        gap: 8px;
      }
      .path-input-row input,
      .path-input-row select {
        flex: 1;
      }
      .settings-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
        gap: 10px;
      }
      .map-subgroup {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 16px;
        margin-top: 10px;
      }
      .field-block {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
        font-size: 0.85rem;
        color: #c9cdd6;
      }
      .form-actions {
        display: flex;
        align-items: center;
        gap: 10px;
        margin-top: 10px;
      }
      .launch-command-preview {
        width: 100%;
        box-sizing: border-box;
        font-family: 'SF Mono', Consolas, monospace;
        font-size: 0.8rem;
        resize: vertical;
      }
      .launch-command-section button {
        margin-top: 8px;
      }
      a {
        color: #8ab4ff;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html">&larr; back to the main PoC page</a></p>
    <div class="page">
      <h1>Settings</h1>
      <div id="root"></div>
    </div>
    <script type="module" src="settings.js"></script>
  </body>
</html>
