<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Minecraft Server Detail - real MinecraftServerDetail/index.tsx through Tauri</title>
    <link rel="stylesheet" href="xterm.css" />
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      h1 {
        font-size: 1.3rem;
      }
      h3 {
        margin: 0 0 8px;
      }
      h4 {
        margin: 0;
        font-size: 0.9rem;
      }
      p {
        color: #c9cdd6;
        font-size: 0.9rem;
      }
      code {
        background: #0f1115;
        padding: 1px 4px;
        border-radius: 3px;
      }
      button {
        background: #2c303a;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #3a3f4b;
      }
      button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
      }
      button.danger:hover:not(:disabled) {
        border-color: #e5484d;
        color: #e5484d;
      }
      input,
      select {
        background: #0f1115;
        color: #e6e8ec;
        border: 1px solid #2c303a;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      label {
        display: flex;
        flex-direction: column;
        gap: 4px;
        margin-bottom: 10px;
        font-size: 0.85rem;
        color: #c9cdd6;
      }
      label.checkbox {
        flex-direction: row;
        align-items: center;
        gap: 6px;
      }
      .cluster-section {
        background: #1a1d24;
        border: 1px solid #2c303a;
        border-radius: 10px;
        padding: 14px 16px;
        margin-bottom: 16px;
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .empty-state {
        color: #9aa0ab;
      }
      .error-message {
        color: #ff8080;
      }
      .muted {
        color: #9aa0ab;
        font-weight: 400;
        font-size: 0.8rem;
      }
      .form-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 8px 0;
      }
      .path-input-row {
        display: flex;
        gap: 8px;
      }
      .path-input-row input,
      .path-input-row select {
        flex: 1;
      }
      .settings-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 12px;
      }
      .settings-grid label {
        margin-bottom: 0;
      }
      .server-settings-tab {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 16px;
      }
      .server-settings-tab > .cluster-section {
        flex: 1 1 380px;
        max-width: 480px;
      }
      .server-settings-tab > p,
      .server-settings-tab > .form-actions,
      .server-settings-tab > .error-message {
        flex: 1 1 100%;
        max-width: none;
        margin: 0;
      }
      .server-type-icon {
        width: 14px;
        height: 14px;
        border-radius: 3px;
        object-fit: cover;
        flex-shrink: 0;
      }
      .server-type-icon-large {
        width: 28px;
        height: 28px;
        border-radius: 4px;
        object-fit: cover;
      }
      /* Console tab */
      .console-tab {
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .mc-console-terminal {
        height: 400px;
        background: #14161a;
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 6px;
      }
      /* Mods tab */
      .mc-mods-browse-heading {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .mc-mods-grid {
        display: grid;
        width: 100%;
        column-gap: 12px;
      }
      .mc-mods-grid--browse {
        grid-template-columns: minmax(0, 260px) minmax(0, 1fr) 100px 110px auto;
      }
      .mc-mods-grid--installed {
        grid-template-columns: minmax(0, 1fr) 100px 150px 130px auto;
      }
      .mc-mods-grid-header,
      .mc-mods-grid-cell {
        display: flex;
        align-items: center;
        min-width: 0;
        padding: 8px;
        border-bottom: 1px solid #2c303a;
        font-size: 0.85rem;
      }
      .mc-mods-grid-header {
        font-weight: 600;
      }
      .mc-mods-grid-empty {
        grid-column: 1 / -1;
        color: #9aa0ab;
      }
      .mc-mod-name-cell {
        gap: 8px;
      }
      .mc-mod-source-cell {
        gap: 6px;
        flex-wrap: wrap;
      }
      .mc-mod-source-icon {
        width: 22px;
        height: 22px;
        object-fit: contain;
        flex-shrink: 0;
      }
      .mc-mod-description-cell {
        white-space: normal;
        align-items: flex-start;
      }
      .mc-mod-title {
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
        min-width: 0;
      }
      .mc-mods-grid-actions {
        gap: 8px;
        flex-wrap: nowrap;
      }
      .mc-mod-icon {
        width: 24px;
        height: 24px;
        border-radius: 4px;
        object-fit: cover;
        flex-shrink: 0;
      }
      /* Backups tab */
      .backup-management-actions {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 4px 8px;
        border-bottom: 1px solid #2c303a;
      }
      tr.selected {
        background: #1f2a3d;
      }
      .backup-log-panel {
        background: #1a1d24;
        border: 1px solid #2c303a;
        border-radius: 10px;
        padding: 14px 16px;
      }
      .backup-log-list {
        max-height: 240px;
        overflow-y: auto;
        background: #0f1115;
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 8px 10px;
        margin-top: 8px;
      }
      .backup-log-line {
        margin: 0 0 4px;
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 0.82rem;
      }
      .backup-log-time {
        color: #7d8494;
        margin-right: 6px;
      }
      /* Server Management tab (schedules) */
      .server-management-tab {
        display: flex;
        flex-direction: row;
        flex-wrap: wrap;
        align-items: flex-start;
        gap: 20px;
      }
      .server-management-tab > .schedule-section {
        flex: 1 1 380px;
        max-width: 480px;
      }
      .server-management-tab > .error-message,
      .server-management-tab > .empty-state {
        flex: 1 1 100%;
        max-width: none;
      }
      .schedule-section {
        background: #1a1d24;
        border: 1px solid #2c303a;
        border-radius: 10px;
        padding: 14px 16px;
        display: flex;
        flex-direction: column;
        gap: 10px;
      }
      .schedule-subsection {
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .schedule-subsection + .schedule-subsection {
        border-top: 1px solid #2c303a;
        padding-top: 10px;
      }
      .schedule-picker {
        display: flex;
        flex-direction: column;
        gap: 8px;
      }
      .schedule-picker-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 10px;
      }
      .schedule-days-row {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 8px 10px;
      }
      .schedule-day {
        flex-direction: row;
        align-items: center;
        gap: 4px;
        white-space: nowrap;
      }
      .schedule-suboptions {
        display: flex;
        flex-direction: column;
        gap: 6px;
        padding-left: 20px;
      }
      .schedule-countdown {
        margin: 0;
        color: #3fbf6f;
        font-weight: 600;
      }
      /* Tab shell (index.tsx itself) - same shape as the ARK-side server-detail.html's own shell */
      .settings-view {
        padding: 0 !important;
        display: flex;
        flex-direction: column;
        height: 100%;
      }
      .settings-view .server-detail-header {
        padding: 24px 24px 0;
        margin-bottom: 16px;
      }
      .server-detail-header h1 {
        margin: 0;
        font-size: 1.4rem;
      }
      .settings-shell {
        display: flex;
        flex: 1;
        min-height: 0;
      }
      .settings-nav {
        width: 220px;
        flex-shrink: 0;
        padding: 0 10px 24px;
        border-right: 1px solid #2c303a;
        overflow-y: auto;
      }
      .settings-nav-group + .settings-nav-group {
        margin-top: 18px;
      }
      .settings-nav-group-label {
        padding: 0 10px 6px;
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: #9aa0ab;
      }
      .settings-nav button {
        display: flex;
        align-items: center;
        gap: 8px;
        width: 100%;
        text-align: left;
        background: transparent;
        border: none;
        border-radius: 8px;
        padding: 8px 10px;
        color: #9aa0ab;
        font-size: 0.88rem;
      }
      .settings-nav button:hover {
        background: #14161a;
        color: #e6e8ec;
      }
      .settings-nav button.active {
        background: rgba(79, 140, 255, 0.15);
        color: #e6e8ec;
        font-weight: 600;
      }
      .settings-nav-icon {
        flex-shrink: 0;
      }
      .settings-content {
        flex: 1;
        min-width: 0;
        overflow-y: auto;
        padding: 0 24px 24px;
      }
      .settings-content-header {
        margin-bottom: 18px;
      }
      .settings-content-header h2 {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0 0 4px;
        font-size: 1.2rem;
      }
      .settings-content-header p {
        margin: 0;
        color: #9aa0ab;
        font-size: 0.85rem;
      }
      html,
      body,
      #root {
        height: 100%;
      }
      a {
        color: #8ab4ff;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html" style="color: #8ab4ff">&larr; back to the main PoC page</a></p>
    <div id="root"></div>
    <script type="module" src="minecraft-server-detail.js"></script>
  </body>
</html>
