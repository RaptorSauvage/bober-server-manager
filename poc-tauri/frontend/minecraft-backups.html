<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Minecraft Backups - real BackupsTab.tsx through Tauri</title>
    <style>
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        background: #14161a;
        color: #e6e8ec;
      }
      .page {
        padding: 24px;
        max-width: 1100px;
      }
      h3 {
        margin-top: 0;
      }
      label {
        display: block;
        margin-bottom: 10px;
      }
      label.checkbox {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      input {
        background: #0f1115;
        color: #e6e8ec;
        border: 1px solid #2c303a;
        border-radius: 4px;
        padding: 4px 8px;
        font: inherit;
      }
      button {
        background: #2c303a;
        color: #e6e8ec;
        border: 1px solid #3a3f4b;
        border-radius: 4px;
        padding: 4px 10px;
        cursor: pointer;
        font: inherit;
      }
      button:hover {
        background: #3a3f4b;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      .path-input-row {
        display: flex;
        gap: 8px;
      }
      .path-input-row input {
        flex: 1;
      }
      .form-actions {
        display: flex;
        align-items: center;
        gap: 12px;
        margin: 12px 0;
      }
      .backup-sections {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }
      .backup-management-actions {
        display: flex;
        gap: 8px;
        margin-bottom: 10px;
        flex-wrap: wrap;
      }
      table {
        border-collapse: collapse;
        width: 100%;
      }
      th,
      td {
        text-align: left;
        padding: 4px 8px;
        border-bottom: 1px solid #2c303a;
      }
      tr.selected {
        background: #1f2a3d;
      }
      .backup-log-panel {
        background: #1a1d24;
        border: 1px solid #2c303a;
        border-radius: 10px;
        padding: 14px 16px;
      }
      .backup-log-list {
        max-height: 240px;
        overflow-y: auto;
        background: #0f1115;
        border: 1px solid #2c303a;
        border-radius: 6px;
        padding: 8px 10px;
        margin-top: 8px;
      }
      .backup-log-line {
        margin: 0 0 4px;
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-size: 0.82rem;
      }
      .backup-log-time {
        color: #7d8494;
        margin-right: 6px;
      }
      .empty-state {
        color: #9aa0ab;
      }
      .error-message {
        color: #ff8080;
      }
      a {
        color: #8ab4ff;
      }
    </style>
  </head>
  <body>
    <p style="padding: 12px 24px 0"><a href="index.html">&larr; back to the main PoC page</a></p>
    <div class="page">
      <h1 style="font-size: 1.3rem">Minecraft Backups</h1>
      <div id="root"></div>
    </div>
    <script type="module" src="minecraft-backups.js"></script>
  </body>
</html>
